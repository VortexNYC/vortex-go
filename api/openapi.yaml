        - lang: Shell
          label: curl
          source: |-
            curl "https://api.vortex.nyc/v1/checkout/sessions?environment=sandbox&merchantAccountId=..." \
              -X POST \
              -H "Authorization: Bearer $VORTEX_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"mode":"subscription","customerExternalId":"cus_123","subscriptionExternalId":"sub_123","collectionMode":"automatic","lineItems":[{"priceId":"price_core_monthly","quantity":1}],"createdByRef":"internal-integration"}'
        - lang: TypeScript
          label: TypeScript
          source: |-
            import { createCheckoutSession, createVortex } from "@vortex-api/vortex/2026-08";

            const vortex = createVortex({ apiKey: process.env.VORTEX_API_KEY });
            const { data } = await createCheckoutSession({
              client: vortex,
              query: { environment: "sandbox", merchantAccountId: "..." },
              body: {"mode":"subscription","customerExternalId":"cus_123","subscriptionExternalId":"sub_123","collectionMode":"automatic","lineItems":[{"priceId":"price_core_monthly","quantity":1}],"createdByRef":"internal-integration"},
