components:
  parameters:
    IdempotencyKey:
      description:
        Required for production-safe retries on mutating routes. Reusing
        a key with a different request body returns 409.
      explode: false
      in: header
      name: Idempotency-Key
      required: false
      schema:
        minLength: 1
